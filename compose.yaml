services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: precious-metals-frontend

    ports:
      - "5173:5173"

    volumes:
      # Mount source code for hot reload
      - ./frontend:/app

      # Keep node_modules inside the container
      - /app/node_modules

    environment:
      VITE_API_URL: http://localhost:8080

    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: precious-metals-backend

    working_dir: /app

    ports:
      - "8080:8080"

    volumes:
      # Mount source; a watcher inside the container recompiles on change.
      - ./backend:/app
      # Keep compiled classes in the container (host target/ can conflict).
      - /app/target
      - maven-repo:/root/.m2

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_RESTART_POLLINTERVAL: 1s
      SPRING_DEVTOOLS_RESTART_QUIETPERIOD: 400ms
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/precious_metals
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-precious_metals}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_PORTFOLIO_VALUATION_CACHE_TTL: ${APP_PORTFOLIO_VALUATION_CACHE_TTL:-PT15S}
      APP_PORTFOLIO_VALUATION_CACHE_KEY_PREFIX: ${APP_PORTFOLIO_VALUATION_CACHE_KEY_PREFIX:-portfolio:valuation}
      MARKET_PRICE_API_URL: ${MARKET_PRICE_API_URL:-http://market-api:8090}
      MARKET_PRICE_REFRESH_CRON: ${MARKET_PRICE_REFRESH_CRON:-*/4 * * * * *}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-api:
        condition: service_started

  market-api:
    build:
      context: ./mock-external-api
      dockerfile: Dockerfile

    container_name: precious-metals-market-api

    ports:
      - "8090:8090"

  postgres:
    image: postgres:17-alpine

    container_name: precious-metals-postgres

    environment:
      POSTGRES_DB: precious_metals
      POSTGRES_USER: ${POSTGRES_USER:-precious_metals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-precious_metals} -d precious_metals"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

    container_name: precious-metals-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  maven-repo:
