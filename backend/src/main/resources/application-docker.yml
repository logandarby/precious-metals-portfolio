spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  # Poll classpath: Docker bind mounts often do not deliver inotify events.
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms

logging:
  level:
    com.example.preciousmetals: INFO
    org.springframework.security: DEBUG

