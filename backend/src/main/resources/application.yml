spring:
  application:
    name: precious-metals-tracker

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  jpa:
    open-in-view: false

  flyway:
    enabled: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        max-age: 30m

logging:
  level:
    com.example.preciousmetals: INFO

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  market-price:
    api-url: ${MARKET_PRICE_API_URL:http://localhost:8090}
    refresh-cron: ${MARKET_PRICE_REFRESH_CRON:0 */5 * * * *}
  portfolio-valuation:
    cache-ttl: ${APP_PORTFOLIO_VALUATION_CACHE_TTL:PT30M}
    cache-key-prefix: ${APP_PORTFOLIO_VALUATION_CACHE_KEY_PREFIX:portfolio:valuation}
