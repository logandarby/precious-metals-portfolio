spring:
  application:
    name: precious-metals-tracker

  jpa:
    open-in-view: false

  flyway:
    enabled: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        max-age: 30m

logging:
  level:
    com.example.preciousmetals: INFO

app:
  cors:
    allowed-origins: http://localhost:5173
  market-price:
    api-url: ${MARKET_PRICE_API_URL:http://localhost:8090}
    refresh-cron: ${MARKET_PRICE_REFRESH_CRON:0 0 6 * * *}
