spring:
  application:
    name: precious-metals-tracker

  jpa:
    open-in-view: false

  flyway:
    enabled: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        max-age: 30m

logging:
  level:
    com.example.preciousmetals: INFO

app:
  cors:
    allowed-origins: http://localhost:5173
